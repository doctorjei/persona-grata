##################################################################################################
# prs -- a Rust password manager over the same store
#
# A single binary needing no shell, reading the same ~/.password-store and honouring
# PASSWORD_STORE_DIR. Distribution is thinner than the other two -- AUR, Homebrew, scoop, or a
# prebuilt static x86_64 binary from its release page -- so it is the supported option rather than
# the expected one.
#
# `--no-interact` is global and suppresses every prompt, which is what setup and the wrapper both
# require; `show --first` takes the first line only, the key. `add --stdin` writes without an
# editor.
#
# NOTE: prs is the only shipped backend that can be built against a non-GnuPG OpenPGP stack --
# `backend-rpgpie` uses rPGP, which reads RFC 9580 (v6 keys, SEIPDv2) where GnuPG does not. That
# is a COMPILE-TIME feature and not the default, so a packaged or prebuilt prs is GnuPG-backed.
# Nothing here depends on it either way.

prs:
  fetch: "prs show --no-interact --first {{entry}}"
  store: "prs add --no-interact --stdin {{entry}}"
  probe: "prs"
