##################################################################################################
# Secret Backend Default Settings
#
# A *secret backend* is the password manager holding a persona's API key. persona-grata does not
# encrypt anything and never invokes `gpg` or `sq`: it runs the manager the user already has, and
# reads the key from that command's stdout. So the OpenPGP format question -- v4 against v6,
# LibrePGP against RFC 9580 -- is never ours to answer. Whatever wrote the store reads it back.
#
# These files are the REGISTRY. A persona names one and supplies the entry:
#
#   personas:
#     kimi:
#       secret:
#         backend: pass
#         entry: "work/kimi"
#
# Layered exactly as dialects are, most specific winning:
#
#   secret:  secret.default -> secret.<backend> -> persona's `secret:` block -> user
#
# Backends are ordinary presets (secret.<id>.yaml), discovered like persona.<id>.yaml. Three ship
# -- pass, gopass, prs -- and a site can add its own by declaring the same keys, because a backend
# is nothing more than a pair of commands.

backend: None                # Which manager holds the key. None = this persona has no key
entry: ""                    # Entry name within the manager's store (store-relative)

fetch: ""                    # Command printing the key on STDOUT. Run at setup and by the wrapper
store: ""                    # Command reading the key from STDIN. Run at setup only
probe: ""                    # Executable that must exist; named in the error when it does not

### `fetch` is the load-bearing one: it is embedded in the generated shell wrapper, so it runs at
### every agent launch, unattended, with no terminal to prompt at. A command that can block on a
### passphrase will hang the agent rather than fail it -- which is why gpg-agent priming is a
### documented requirement rather than a footnote.

### `store` is optional. A backend that can only be written to interactively simply leaves it
### unset, and setup tells the user to add the entry themselves rather than pretending to.
