format: "agents-yapyon-v0.1"
agents: {}

defaults:
  secret:
    backend: None
    root: "agents"

env_add: []
env_allow:
  - "COLUMNS"
  - "DATEMSK"
  - "HOME"
  - "LANG"
  - "LANGUAGE"
  - "LC_ALL"
  - "LC_COLLATE"
  - "LC_CTYPE"
  - "LC_MESSAGES"
  - "LC_MONETARY"
  - "LC_NUMERIC"
  - "LC_TIME"
  - "LINES"
  - "LOGNAME"
  - "MSGVERB"
  - "NLSPATH"
  - "PATH"
  - "PWD"
  - "SHELL"
  - "TERM"
  - "TEXTDOMAIN"
  - "TEXTDOMAINDIR"
  - "TMPDIR"
  - "TZ"
  - "XDG_CACHE_HOME"
  - "XDG_CONFIG_DIRS"
  - "XDG_CONFIG_HOME"
  - "XDG_DATA_DIRS"
  - "XDG_DATA_HOME"
  - "XDG_RUNTIME_DIR"
  - "XDG_STATE_HOME"
