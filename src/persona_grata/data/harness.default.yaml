##################################################################################################
# Harness Default Settings

harness_desc: "{{__PARENT__.__KEY__}}"           # Short Description (defaults to key string)
path: "{{path}}/{{__PARENT__.__KEY__}}"          # Path to custom harness settings files
auth_var: "API_KEY"                              # Env. variable holding key/token
path_var: ""                                     # Store var., harness config path (default: none)
config_file: ""                                  # Main harness config file (skips if empty/unset)
config_store: {}                                 # Harness config data (stored in config file)
content: ""                                      # Content of harness config file (default: empty)
base_uri: "{{mind.endpoint}}"                    # Base URI for remote connections
verify:                                          # Auth verification settings
  url: "{{base_uri}}/v1/chat/completions"        # URL for auth verification (default OpenAI std)
  key_header: "Authorization: Bearer"            # Auth header variant (default OpenAI std)
  headers: []                                    # List: [<header text>*]

### If user incorporates "verify" but not all parameters, default values will be _copied into_
### the "verify" block.
