##################################################################################################
# gopass -- a Go rewrite of pass
#
# A single static binary that needs no shell, so it works where bash is absent. Widely packaged
# (Debian, Ubuntu, Fedora, Homebrew, Arch, scoop). Its GPG backend uses the same store layout as
# pass, so one store serves both.
#
# `-o` is documented as "Display only the password. Takes precedence over all other flags", which
# is what makes it safe for an entry carrying more than the key. `insert` reads stdin whenever
# stdin is not a terminal, so it needs no flag to be scriptable.
#
# NOTE: gopass can also be backed by `age` instead of GPG. That store is NOT readable by pass or
# prs -- it is a separate island rather than an alternative reader of the same files. Nothing here
# depends on which backend it uses, since we only ever run the command.

gopass:
  fetch: "gopass show -o {{entry}}"
  store: "gopass insert {{entry}}"
  probe: "gopass"
