##################################################################################################
# pass -- the standard unix password manager
#
# Packaged by every distribution, and the tool a pre-existing ~/.password-store was almost
# certainly created with. A bash script over `gpg`, so it needs bash present; a persona on a box
# without bash wants gopass or prs instead.
#
# `show` prints the whole entry; an entry holding only a key is therefore one line. `insert -m`
# reads the body from stdin, and `-f` overwrites without asking -- both required for unattended
# setup, since the interactive prompts have no answer in a script.

pass:
  fetch: "pass show {{entry}}"
  store: "pass insert -m -f {{entry}}"
  probe: "pass"
