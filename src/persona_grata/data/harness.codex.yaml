
##################################################################################################
# Codex-CLI Harness Settings

codex:
  harness_desc: "Codex CLI"
  path_var: "CODEX_HOME"
  config_file: "{{path}}/config.toml"
  config_store:
    model: "{{mind.model}}"
    model_provider: "{{hid}}"

    # Nested maps become TOML tables, so this renders as [model_providers.codex].
    model_providers:
      "{{hid}}":
        name: "{{persona_desc}}"
        base_url: "{{base_uri}}"
        wire_api: "responses"
        env_key: "{{auth_var}}"
  content: "{{config_store.__AS_TOML__()}}"
