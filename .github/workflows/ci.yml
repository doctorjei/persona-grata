name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # Ends of the supported range. The floor is yapyon's, and matches
        # Debian 12 (bookworm), the oldest Debian release still supported.
        python-version: ["3.11", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - run: pip install -e ".[dev]"
      - run: pytest -q

  package:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - run: pip install build twine
      - run: python -m build
      - run: twine check dist/*
      # The shipped presets are the product; a wheel without them installs
      # cleanly and then fails at runtime.
      - name: Verify presets ship in the wheel
        run: |
          python -m zipfile -l dist/*.whl > wheel.txt
          for f in global.tmpl agents/base.agent.tmpl \
                   agents/minimax_claude.agent.tmpl personas/base.persona.tmpl \
                   personas/kimi.persona.tmpl harnesses/claude.harness.tmpl \
                   harnesses/codex.harness.tmpl dialects/chat.dialect.tmpl \
                   secrets/pass.secret.tmpl agent_store-defaults.cfg; do
            grep -q "persona_grata/data/$f" wheel.txt || { echo "missing from wheel: $f"; exit 1; }
          done
      - name: Verify the installed console scripts run
        run: |
          pip install dist/*.whl
          persona-grata --help
          pg --help
          export HOME="$(mktemp -d)"
          export AGENT_STORE_DIR="$HOME/.config/agents"
          pg --create minimax claude --no-token --no-wrapper
          pg minimax_claude --export "$HOME/agent.cfg"
          pg --update minimax_claude --name smoke --no-wrapper
          pg --remove smoke --yes

  # A reminder, not a catch: no branch protection requires this job, so an
  # agent with write access could gut it. Declared as what it is until that
  # changes. Runs 3.13 only.
  kinemata:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      # Exact pin: 0.x API is unsettled per its README, so no >=, no git ref.
      # 0.5.1 -- past 0.4.0 (exclude is whole-segment, not substring) and 0.5.1
      # (a baseline re-recorded locks what each gate covers; record under 0.5.1).
      - run: pip install "kinemata==0.5.1"
      # Advisory first, so the log shows the full picture even when green.
      - run: kinemata review --verbose
      - run: kinemata check
      - run: kinemata claims
      - run: kinemata parity
