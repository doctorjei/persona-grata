persona_store: "~/.alternative_config/personas"

personas:
  # Nice and simple example; endpoint-only, no model selection.
  easy_api:
    mind:
      endpoint: "https://api.easypeasy.org"

  # A more typical configuration (endpoint URL & model)
  orion:
    persona_desc: "Orion Toolkit"
    mind:
      endpoint: "https://api.cybertron.space"
      model: "alpha-3-on"

  # Highly customized agent (paths, URLs, etc.)
  pax:
    persona_desc: "Pax Toolkit"
    mind:
      endpoint: "https://api.moonbase.space"
    harnesses:
      claude:
        harness_desc: "Sneaky Claude"
        path: "~/my/secret/claude"
        base_uri: "{{mind.endpoint}}/anthropic_api"
        verify:
          url: "{{base_uri}}/verify_me"
          # Requires traditional Anthropic-style keys:
          key_header: "x-api-key:"
      codex:
        base_uri: "{{mind.endpoint}}/openai_api"
